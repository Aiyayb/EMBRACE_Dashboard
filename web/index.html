<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EMBRACE OS</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="profile"><button type="button" class="avatar" id="avatar" title="Change profile photo" aria-label="Change profile photo"><span id="avatar-initial">B</span><span class="avatar-edit" aria-hidden="true"><svg class="ico" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg></span></button><h1 class="welcome">Welcome, Besttttt</h1></div>
    <nav class="nav" id="nav" aria-label="Pages">
      <button type="button" data-page="home"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Home</button>
      <button type="button" data-page="investment"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V5"/><path d="M4 19h16"/><path d="M8 15l4-4 3 3 5-6"/></svg>Stock</button>
      <button type="button" data-page="trading"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M9.5 9.5c0-1 1-1.6 2.5-1.6s2.5.6 2.5 1.6-1 1.4-2.5 1.6-2.5.6-2.5 1.6 1 1.6 2.5 1.6 2.5-.6 2.5-1.6"/></svg>Trading</button>
      <button type="button" data-page="shop"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8l1.5-4h13L20 8"/><path d="M4 8v12h16V8"/><path d="M4 8c0 1.7 1.3 3 2.7 3S9.3 9.7 9.3 8c0 1.7 1.3 3 2.7 3s2.7-1.3 2.7-3c0 1.7 1.3 3 2.7 3S20 9.7 20 8"/></svg>Online Shop</button>
      <button type="button" data-page="wealth"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 109 9h-9z"/><path d="M15 3.5A9 9 0 0120.5 9H15z"/></svg>Saving</button>
      <button type="button" data-page="expense"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/><path d="M7 15h3"/></svg>Cash Flow M.</button>
      <button type="button" data-page="plan"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h14v18l-7-4-7 4z"/></svg>Plan</button>
      <button type="button" data-page="assets"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.4 5 5.6.8-4 3.9.9 5.6-4.9-2.6-4.9 2.6.9-5.6-4-3.9L9.6 8z"/></svg>All Asset Class</button>
      <button type="button" data-page="history"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 109-9 9 9 0 00-6.4 2.6L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></svg>History</button>
    </nav>
    <nav class="nav nav-advise" id="nav-advise" aria-label="Maki">
      <button type="button" data-page="advise"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h14v10H9l-4 4z"/></svg>Maki Advise</button>
    </nav>
    <div class="maki"><img src="assets/maki.jpg" alt="Maki"></div>
    <div class="side-links" id="side-links"></div>
  </aside>
  <div class="main">
    <header class="top">
      <div class="brand"><span class="logo">EO</span>EMBRACE OS</div>
      <span class="top-sep" aria-hidden="true"></span>
      <p class="sub" id="sub"></p>
      <div class="chips" id="chips"></div>
    </header>
    <main class="body" id="page"></main>
  </div>
</div>
<dialog id="dialog" class="dialog"></dialog>
<div id="toast" class="toast" hidden></div>
<script src="app.js"></script>
</body>
</html>
